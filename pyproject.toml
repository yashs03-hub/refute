[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "refute"
version = "0.1.0"
description = "Benchmarking experiment-designing agents against experiments that failed"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Only needed for `refute run`. The twin, the sweep and the tests do not
# call any model.
agent = ["anthropic>=0.40"]
# The HTTP surface. `/score` still calls no model - the server needs a
# credential only for the endpoints that extract prose or drive an agent.
api = ["fastapi>=0.110", "uvicorn>=0.22"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
refute = "refute.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["refute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
